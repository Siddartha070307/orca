<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="orcaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Deep Ocean Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#0b172a" stroke="url(#ringGrad)" stroke-width="2.5" />

  <!-- Radar / Compass Ring -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" />
  <circle cx="50" cy="50" r="22" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.4" />

  <!-- Compass Crosshairs -->
  <line x1="50" y1="8" x2="50" y2="20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="80" x2="50" y2="92" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="8" y1="50" x2="20" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="80" y1="50" x2="92" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Stylized Anchor / Marine Star -->
  <g transform="translate(50, 50)">
    <!-- Anchor Ring -->
    <circle cx="0" cy="-22" r="5.5" fill="none" stroke="#f8fafc" stroke-width="2.5" />
    <!-- Vertical Shank -->
    <line x1="0" y1="-16.5" x2="0" y2="18" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <!-- Stock (Horizontal Crossbar) -->
    <line x1="-12" y1="-10" x2="12" y2="-10" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    <!-- Curved Flukes -->
    <path d="M -20 8 C -14 24 14 24 20 8" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <!-- Fluke Arrowheads -->
    <polygon points="-20,8 -24,4 -18,2" fill="#38bdf8" />
    <polygon points="20,8 24,4 18,2" fill="#38bdf8" />
    <!-- Center Core Glow Point -->
    <circle cx="0" cy="0" r="3" fill="#06b6d4" />
  </g>
</svg>
